<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>El Vinero - Simulador de Carrera & Creación Vitivinícola</title>
  <meta name="description" content="El Vinero: Simulador de carrera vitivinícola, enología de autor y diseño de etiquetas de lujo en Argentina.">

  <!-- FUENTES DE ALTA GAMA EDITORIAL -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,400;1,600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       ESTÉTICA: MINIMALISMO DE LUJO EDITORIAL (EL VINERO)
       ========================================================================== */
    :root {
      --font-display: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --font-serif: 'Cormorant Garamond', 'Palatino Linotype', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-script: 'Pinyon Script', cursive;
      --font-mono: 'Space Grotesk', monospace;

      --bg-body: #08080a;
      --bg-card: #111115;
      --bg-card-hover: #17171d;
      --bg-elevated: #1a1a22;

      --text-main: #f4f4f6;
      --text-muted: #93939f;
      --text-dim: #60606d;

      --bordo-primary: #801424;
      --bordo-hover: #9c192d;
      --bordo-subtle: rgba(128, 20, 36, 0.18);
      --bordo-border: rgba(156, 25, 45, 0.35);
      --bordo-glow: rgba(156, 25, 45, 0.6);

      --gold-primary: #c5a059;
      --gold-light: #e4ca8f;
      --gold-subtle: rgba(197, 160, 89, 0.15);

      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;

      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-body); }
    ::-webkit-scrollbar-thumb { background: #22222a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--bordo-primary); }

    body {
      background-color: var(--bg-body);
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(128, 20, 36, 0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(128, 20, 36, 0.08) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* TIPOGRAFÍA */
    h1, h2, h3, h4 {
      font-family: var(--font-display);
      font-weight: 600;
      color: #fff;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .editorial-serif {
      font-family: var(--font-serif);
    }

    .mono {
      font-family: var(--font-mono);
    }

    .tag-label {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--gold-light);
    }

    .brand-title {
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #ffffff 0%, #f0e6e8 40%, #c48b94 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: rgba(17, 17, 21, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      position: sticky;
      top: 16px;
      z-index: 100;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-logo {
      font-size: 20px;
      font-weight: 700;
    }

    .nav-winemaker {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      background: var(--bordo-subtle);
      border: 1px solid var(--bordo-border);
      border-radius: var(--radius-sm);
      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e0314b;
      box-shadow: 0 0 8px #e0314b;
    }

    .nav-stats {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .stat-value {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      font-family: var(--font-mono);
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    /* BOTONES */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--bordo-primary);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 16px rgba(128, 20, 36, 0.35);
    }

    .btn-primary:hover {
      background: var(--bordo-hover);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 6px 20px var(--bordo-glow);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--border-hover);
      color: #fff;
    }

    .btn-sm { padding: 6px 14px; font-size: 11.5px; }
    .btn-lg { padding: 14px 28px; font-size: 14px; font-weight: 600; }

    /* CARDS */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 20px;
      transition: var(--transition);
    }

    .banner-grid {
      display: grid;
      grid-template-columns: 1.8fr 1.2fr;
      gap: 24px;
      align-items: center;
      background: linear-gradient(135deg, #111116 0%, #171114 100%);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 24px 28px;
      margin-bottom: 20px;
    }

    /* STEPPER */
    .stepper {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .step-pill {
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .step-pill.active {
      border-color: var(--bordo-border);
      background: var(--bordo-subtle);
      color: #fff;
      font-weight: 500;
    }

    .step-pill.completed {
      border-color: rgba(74, 222, 128, 0.25);
      color: #86efac;
    }

    .step-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
      font-family: var(--font-mono);
    }

    .step-pill.active .step-num {
      background: var(--bordo-primary);
      color: #fff;
    }

    /* STUDIO DE BOTELLA Y ETIQUETA */
    .stage-container {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 32px;
      align-items: center;
      padding: 30px;
      background: linear-gradient(135deg, #0d0d10 0%, #140d10 100%);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      margin-bottom: 20px;
    }

    .bottle-frame {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .bottle-neck {
      width: 48px;
      height: 54px;
      background: linear-gradient(90deg, #151515 0%, #303030 50%, #101010 100%);
      border-radius: 4px 4px 0 0;
      position: relative;
      margin-bottom: -4px;
      display: flex;
      justify-content: center;
    }

    .neck-seal-wax {
      position: absolute;
      top: 0;
      width: 100%;
      height: 38px;
      background: radial-gradient(circle at 40% 30%, #a6122a, #4a0510);
      border-radius: 3px 3px 8px 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: #fce7eb;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .neck-seal-wax::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 14px;
      width: 8px;
      height: 8px;
      background: #4a0510;
      border-radius: 50%;
    }

    .neck-seal-tin {
      position: absolute;
      top: 0;
      width: 100%;
      height: 42px;
      background: linear-gradient(90deg, #222, #555 50%, #181818);
      border-radius: 3px 3px 2px 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      letter-spacing: 0.1em;
      color: #ddd;
    }

    .neck-seal-beeswax {
      position: absolute;
      top: 0;
      width: 100%;
      height: 34px;
      background: radial-gradient(circle at 40% 30%, #c5a059, #6d5120);
      border-radius: 3px 3px 6px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: #fff;
      font-weight: 700;
    }

    .wine-label {
      width: 260px;
      min-height: 370px;
      border-radius: 2px;
      padding: 24px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(0,0,0,0.5);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: var(--transition);
    }

    .label-badge {
      display: inline-block;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.16em;
      padding: 4px 8px;
      border-radius: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .label-wine-name {
      font-size: 21px;
      font-weight: 600;
      line-height: 1.15;
      margin: 8px 0 4px 0;
    }

    .label-signature {
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 600;
      opacity: 0.85;
      margin-top: 4px;
    }

    /* GRID DE OPCIONES */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .option-card {
      background: #15151b;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .option-card:hover {
      border-color: var(--border-hover);
      background: #1c1c24;
      transform: translateY(-2px);
    }

    .option-card.selected {
      border-color: var(--bordo-border);
      background: var(--bordo-subtle);
      box-shadow: 0 0 16px rgba(128, 20, 36, 0.25);
    }

    .option-title {
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .option-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* TROFEOS */
    .trophy-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .trophy-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px 8px;
      text-align: center;
      transition: var(--transition);
    }

    .trophy-card.unlocked {
      border-color: var(--gold-primary);
      background: var(--gold-subtle);
    }

    .trophy-count {
      font-size: 13px;
      font-weight: 700;
      color: var(--gold-light);
      font-family: var(--font-mono);
    }

    /* MODALES */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-box {
      background: #111116;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 30px;
      position: relative;
    }

    .modal-close-btn {
      position: absolute;
      top: 18px; right: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      color: var(--text-muted);
      width: 28px; height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .modal-close-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

    .reviews-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin: 16px 0;
    }

    .review-card {
      background: #16161d;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
    }

    .review-card.score-100 {
      border-color: var(--bordo-border);
      background: linear-gradient(135deg, rgba(128, 20, 36, 0.25), #16161d);
    }

    @media (max-width: 820px) {
      .banner-grid { grid-template-columns: 1fr; }
      .stage-container { grid-template-columns: 1fr; }
      .navbar { flex-direction: column; gap: 12px; align-items: flex-start; }
      .nav-stats { width: 100%; justify-content: space-between; }
      .stepper { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

    /* AUDIO ENGINE */
    class SoundEngine {
      constructor() { this.ctx = null; this.enabled = true; }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
      }
      playClick() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(580, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(240, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.04);
      }
      playCorkPop() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(130, t);
        osc.frequency.exponentialRampToValueAtTime(400, t + 0.03);
        osc.frequency.exponentialRampToValueAtTime(70, t + 0.11);
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.12);
      }
      playFanfare() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(f, t + (idx * 0.12));
          gain.gain.setValueAtTime(0.12, t + (idx * 0.12));
          gain.gain.exponentialRampToValueAtTime(0.001, t + (idx * 0.12) + 0.35);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(t + (idx * 0.12)); osc.stop(t + (idx * 0.12) + 0.38);
        });
      }
    }

      constructor() {

      }
      reset() {
        this.player = {
          name: "Valentín Altamira",
          age: 23,

          ],

          trophies: {
            parker100: 0,
            timAtkinWinemaker: 0,
            suckling100: 0,
            descorchadosBest: 0
          }
        };
        this.currentVintage = {
          wineIndex: 0,
          targetWine: null,
          hazard: null,
          hazardResult: null,
          missionStep: 1,
          decisions: {
            canopyWork: "deshoje_moderado",

            harvestTiming: "optima",
            wholeCluster: 20,

            oakType: "roble_frances_usado",

            filtering: "sin_filtrar",
            labelPaper: "algodon",
            labelFont: "playfair",
            labelSeal: "lacre_bordo",
            labelFinish: "numeracion",
            labelFoil: "oro"
          }
        };
        this.setupCurrentWine();
      }

      get currentBodega() {
        return BODEGAS_DB[this.player.currentBodegaId] || BODEGAS_DB["finca_escuela"];
      }

      setupCurrentWine() {
        const b = this.currentBodega;
        const wine = b.wines[this.currentVintage.wineIndex % b.wines.length];
        this.currentVintage.targetWine = wine;
        this.currentVintage.hazard = null;
        this.currentVintage.hazardResult = null;
        this.currentVintage.missionStep = 1;
        const def = wine.labelDefaults || { paper: "algodon", fontStyle: "playfair", sealStyle: "lacre_bordo", finish: "numeracion", foil: "oro" };
        this.currentVintage.decisions = {
          canopyWork: "deshoje_moderado",
          harvestMethod: "cajas_12kg_noche",
          harvestTiming: wine.idealHarvest,
          wholeCluster: wine.idealCluster,
          vessel: wine.idealVessel,
          yeast: "indigenas",
          extractionMethod: "pigeage_manual",
          oakType: "roble_frances_usado",
          oakMonths: wine.idealAging,
          filtering: "sin_filtrar",
          labelPaper: def.paper,
          labelFont: def.fontStyle,
          labelSeal: def.sealStyle,
          labelFinish: def.finish,
          labelFoil: def.foil || "oro"
        };
        return wine;
      }

      triggerHazard() {
        const idx = Math.floor(Math.random() * CELLAR_HAZARDS.length);
        this.currentVintage.hazard = CELLAR_HAZARDS[idx];
        return this.currentVintage.hazard;
      }

      resolveHazard(optIdx) {
        const hazard = this.currentVintage.hazard;
        const opt = hazard.options[optIdx];
        const isSuccess = Math.random() <= opt.rollChance;
        const outcome = isSuccess ? opt.success : (opt.failure || opt.success);
        if (outcome.cost) this.player.wealth += outcome.cost;
        this.currentVintage.hazardResult = { isSuccess, scoreBonus: outcome.scoreBonus || 0, narrative: outcome.msg };
        return { isSuccess, narrative: outcome.msg };
      }

      evaluateWine() {
        const target = this.currentVintage.targetWine;
        const dec = this.currentVintage.decisions;
        const haz = this.currentVintage.hazardResult;
        let score = target.targetScore;

        if (dec.harvestTiming === target.idealHarvest) score += 2;
        if (dec.vessel === target.idealVessel) score += 2;
        if (Math.abs(dec.wholeCluster - target.idealCluster) <= 10) score += 1;
        if (dec.harvestMethod === "cajas_12kg_noche") score += 1;
        if (dec.yeast === "indigenas") score += 1;
        if (dec.filtering === "sin_filtrar") score += 1;
        if (dec.labelPaper === "algodon" || dec.labelPaper === "negro_mate") score += 1;
        if (haz) score += haz.scoreBonus;

        score += Math.floor(Math.random() * 3) - 1;
        score = Math.min(100, Math.max(86, score));

        const basePrice = Math.round(Math.pow(1.16, Math.max(0, score - 85)) * 28);

        const wineObj = {
          name: target.name,
          grape: target.grape,
          year: this.player.currentYear,
          bodegaName: this.currentBodega.name,
          bodegaId: this.currentBodega.id,
          labelDesign: target.labelDesign,
          labelCustom: {
            paper: dec.labelPaper,
            font: dec.labelFont,
            seal: dec.labelSeal,
            finish: dec.labelFinish,
            foil: dec.labelFoil
          },
          winemakerName: this.player.name,
          score: score,
          price: basePrice,
          earnings: Math.round(18000 + (score * 260)),
          newTrophies: [],
          reviews: []
        };

        CRITICS_DB.forEach(c => {
          let s = score + (Math.floor(Math.random() * 3) - 1);
          s = Math.min(100, Math.max(86, s));
          wineObj.reviews.push({ name: c.name, avatar: c.avatar, score: s, note: c.gen(s, wineObj) });
        });

        if (score === 100) {
          this.player.trophies.parker100++;
          wineObj.newTrophies.push("100 PUNTOS ROBERT PARKER (The Wine Advocate)");
          if (Math.random() < 0.6) {
            this.player.trophies.suckling100++;
            wineObj.newTrophies.push("100 PUNTOS JAMES SUCKLING");
          }
        }
        if (score >= 98 && Math.random() < 0.45) {
          this.player.trophies.timAtkinWinemaker++;
          wineObj.newTrophies.push("TIM ATKIN MW • ENÓLOGO DEL AÑO");
        }
        if (score >= 96 && Math.random() < 0.4) {
          this.player.trophies.descorchadosBest++;
          wineObj.newTrophies.push("DESCORCHADOS • MEJOR TINTO");
        }

        this.player.wealth += wineObj.earnings;
        this.player.reputation = Math.min(100, this.player.reputation + Math.round((score - 88) * 1.5));

        this.player.winesHistory.unshift(wineObj);
        return wineObj;
      }

      applyCommercial(vinotecaId) {
        const v = VINOTECAS_DB.find(item => item.id === vinotecaId);
        if (!v) return null;
        this.player.reputation = Math.min(100, this.player.reputation + v.prestigeBoost);
        const extraRevenue = Math.round(16000 * v.salesMult);
        this.player.wealth += extraRevenue;
        this.player.contracts.push(v.name);
        return { vinoteca: v, extraRevenue };
      }

      advanceYear() {
        this.player.currentYear++;
        this.player.age++;
        this.currentVintage.wineIndex++;

        if (this.player.age >= this.player.maxRetirementAge) {
          return { status: "retired" };
        }

        const rep = this.player.reputation;
        const currentId = this.player.currentBodegaId;
        let recruitmentOffer = null;

        if (rep >= 85 && currentId !== "catena_zapata" && currentId !== "perse") {
          recruitmentOffer = Math.random() < 0.5 ? BODEGAS_DB["catena_zapata"] : BODEGAS_DB["perse"];
        } else if (rep >= 70 && (currentId === "finca_escuela" || currentId === "la_estocada" || currentId === "cru_montana")) {
          recruitmentOffer = Math.random() < 0.5 ? BODEGAS_DB["zuccardi"] : BODEGAS_DB["el_enemigo"];
        } else if (rep >= 55 && (currentId === "finca_escuela" || currentId === "cru_montana")) {
          recruitmentOffer = Math.random() < 0.5 ? BODEGAS_DB["chacra"] : BODEGAS_DB["noemia"];
        } else if (rep >= 35 && currentId === "finca_escuela") {
          recruitmentOffer = Math.random() < 0.5 ? BODEGAS_DB["la_estocada"] : BODEGAS_DB["cru_montana"];
        }

        if (recruitmentOffer && recruitmentOffer.id !== currentId) {
          return { status: "offer", recruitedBodega: recruitmentOffer };
        }

        this.setupCurrentWine();
        return { status: "continue", nextWine: this.currentVintage.targetWine };
      }

      acceptRecruitment(newBodegaId) {
        const lastHist = this.player.bodegaHistory[this.player.bodegaHistory.length - 1];
        if (lastHist) lastHist.endYear = this.player.currentYear;

        const newBodega = BODEGAS_DB[newBodegaId];
        const newRole = this.player.reputation >= 80 ? "Director Enológico Principal" : (this.player.reputation >= 50 ? "Head Winemaker" : "Primer Enólogo");
        this.player.currentBodegaId = newBodegaId;
        this.player.role = newRole;
        this.player.bodegaHistory.push({
          bodegaId: newBodegaId, name: newBodega.name, startYear: this.player.currentYear, endYear: null, role: newRole
        });
        this.currentVintage.wineIndex = 0;
        this.setupCurrentWine();
      }
    }

                  </div>
                </div>
                <button class="btn btn-primary btn-sm" onclick="window.UI.confirmAllocation('${v.id}')">
                  Asignar Cupo Exclusivo ➔
                </button>
              </div>
            `).join("")}
          </div>
        `;
        this.showModal(content);
      }

      confirmAllocation(vinotecaId) {
        Sound.playCorkPop();
        const res = Engine.applyCommercial(vinotecaId);
        this.closeModal();

        const content = `
          <div style="text-align: center; padding: 14px;">
            <div style="font-size: 34px; margin-bottom: 8px;">📜✨</div>
            <h3 style="font-size: 22px; margin-bottom: 6px; color: var(--gold-light);">
              Acuerdo Comercial Cerrado con ${res.vinoteca.name}
            </h3>
            <p style="font-size: 13.5px; color: #e5e7eb; margin-bottom: 20px; line-height: 1.5;">
              La vinoteca adquirió la asignación de botellas firmadas por <strong>${Engine.player.name}</strong>. Ganaste <strong>+$${res.extraRevenue.toLocaleString()} USD</strong> y <strong>+${res.vinoteca.prestigeBoost} puntos de prestigio</strong>.
            </p>
            <button class="btn btn-primary btn-lg" onclick="window.UI.advanceNextYear()" style="width: 100%;">
              Avanzar a la Siguiente Añada (${Engine.player.currentYear + 1}) ➔
            </button>
          </div>
        `;
        this.showModal(content);
      }

      advanceNextYear() {
        this.closeModal();
        const stepRes = Engine.advanceYear();

        if (stepRes.status === "retired") {
          this.renderRetirement();
        } else if (stepRes.status === "offer") {
          this.showRecruitment(stepRes.recruitedBodega);
        } else {
          this.renderHub();
        }
      }

      showRecruitment(newBodega) {
        Sound.playClick();
        const content = `
          <div style="text-align: center; padding: 10px;">
            <div style="font-size: 36px; margin-bottom: 6px;">📜🍷</div>
            <div class="tag-label" style="margin-bottom: 4px;">OFERTA DE FICHAJE DE ÉLITE</div>
            <h2 style="font-size: 26px; margin: 4px 0;">${newBodega.name}</h2>
            <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;">
              Dirección: ${newBodega.winemakerLeader}
            </div>

            <div style="background: #16161d; border-left: 2px solid var(--bordo-primary); padding: 14px 16px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; text-align: left; font-size: 13.5px; color: #f3f4f6; line-height: 1.5; margin-bottom: 20px; font-family: var(--font-serif);">
              "Estimado <strong>${Engine.player.name}</strong>, tus últimas añadas han cosechado elogios unánimes. En <strong>${newBodega.name}</strong> queremos que asumas la dirección técnica para liderar nuestras parcelas históricas."
            </div>

            <div style="display: flex; gap: 10px;">
              <button class="btn btn-primary btn-lg" onclick="window.UI.acceptOffer('${newBodega.id}')" style="flex: 1;">
                Aceptar Fichaje por ${newBodega.shortName} ✍️
              </button>
              <button class="btn btn-outline btn-lg" onclick="window.UI.declineOffer()" style="flex: 1;">
                Permanecer en ${Engine.currentBodega.shortName}
              </button>
            </div>
          </div>
        `;
        this.showModal(content);
      }

      acceptOffer(newBodegaId) {
        Sound.playCorkPop();
        Engine.acceptRecruitment(newBodegaId);
        this.closeModal();
        this.renderHub();
      }

      declineOffer() {
        Sound.playClick();
        this.closeModal();
        Engine.setupCurrentWine();
        this.renderHub();
      }

      renderRetirement() {
        Sound.playFanfare();
        const p = Engine.player;
        const totalWines = p.winesHistory.length;
        let sumScore = 0;
        let bestWine = null;

        p.winesHistory.forEach(w => {
          sumScore += w.score;
          if (!bestWine || w.score > bestWine.score) bestWine = w;
        });

        let legacyTitle = "Enólogo Consagrado de los Andes";
        if (p.trophies.parker100 >= 3 || p.reputation >= 90) {
          legacyTitle = "LEYENDA INMORTAL DEL VINO MUNDIAL";
        } else if (p.trophies.parker100 >= 1 || p.trophies.timAtkinWinemaker >= 1) {
          legacyTitle = "MAESTRO CONSAGRADO DE LOS ANDES";
        } else if (p.reputation >= 70) {
          legacyTitle = "DIRECTOR ENOLÓGICO DE CULTO INTERNACIONAL";
        }

        this.root.innerHTML = `
          <div class="card" style="max-width: 760px; margin: 30px auto; padding: 36px; text-align: center;">
            <div style="font-size: 44px; margin-bottom: 6px;">👑🏆</div>
            <div class="tag-label" style="margin-bottom: 6px;">
              SALÓN DE LA FAMA & CEREMONIA DE RETIRO • EL VINERO
            </div>
            <h1 class="brand-title" style="font-size: 42px; margin: 4px 0 8px 0;">
              ${p.name}
            </h1>
            <div style="font-size: 16px; font-weight: 600; color: var(--gold-light); margin-bottom: 24px;">
              ${legacyTitle}
            </div>

            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px;">
              <div style="background: #16161d; padding: 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
                <div style="font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: #fff;">${totalWines}</div>
                <div class="tag-label" style="color: var(--text-muted); font-size: 9px;">Añadas</div>
              </div>
              <div style="background: #16161d; padding: 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
                <div style="font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--gold-light);">${p.trophies.parker100}</div>
                <div class="tag-label" style="color: var(--text-muted); font-size: 9px;">100 Pts Parker</div>
              </div>
              <div style="background: #16161d; padding: 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
                <div style="font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--gold-light);">${p.trophies.timAtkinWinemaker}</div>
                <div class="tag-label" style="color: var(--text-muted); font-size: 9px;">Enólogo del Año</div>
              </div>
              <div style="background: #16161d; padding: 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);">
                <div style="font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: #4ade80;">$${p.wealth.toLocaleString()}</div>
                <div class="tag-label" style="color: var(--text-muted); font-size: 9px;">Patrimonio USD</div>
              </div>
            </div>

            <div style="text-align: left; margin-bottom: 22px;">
              <h3 class="tag-label" style="margin-bottom: 10px; font-size: 11px;">
                Bodegas donde ${p.name} dejó su huella:
              </h3>
              <div style="display: flex; flex-direction: column; gap: 8px;">
                ${p.bodegaHistory.map(h => `
                  <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #16161d; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);">
                    <div>
                      <strong style="color: #fff; font-size: 13.5px;">${h.name}</strong>
                      <div style="font-size: 11.5px; color: var(--text-muted);">${h.role}</div>
                    </div>
                    <div style="font-size: 12px; color: var(--gold-light); font-weight: 600; font-family: var(--font-mono);">
                      ${h.startYear} - ${h.endYear || p.currentYear}
                    </div>
                  </div>
                `).join("")}
              </div>
            </div>

            ${bestWine ? `
              <div style="background: var(--gold-subtle); border: 1px solid var(--gold-primary); padding: 16px; border-radius: var(--radius-sm); text-align: left; margin-bottom: 24px;">
                <div class="tag-label" style="color: var(--gold-light);">Obra Maestra de tu Vida:</div>
                <div style="font-size: 18px; font-weight: 600; color: #fff; font-family: var(--font-display); margin-top: 2px;">${bestWine.name} (${bestWine.year})</div>
                <div style="font-size: 12px; color: var(--text-muted);">${bestWine.bodegaName} | Puntaje Histórico: ${bestWine.score} pts</div>
              </div>
            ` : ''}

            <div style="display: flex; gap: 10px; justify-content: center;">
              <button class="btn btn-primary btn-lg" onclick="window.UI.copySummary()">
                📋 Copiar Resumen de Carrera
              </button>
              <button class="btn btn-outline btn-lg" onclick="window.UI.renderStart()">
                🔄 Nueva Carrera en El Vinero
              </button>
            </div>
          </div>
        `;
      }

      copySummary() {
        Sound.playClick();
        const p = Engine.player;
        const totalWines = p.winesHistory.length;
        const text = `🍷 El Vinero: Carrera de Vida Vitivinícola\n👤 Enólogo: ${p.name}\n🏆 Añadas Elaboradas: ${totalWines} (${p.startYear} - ${p.currentYear})\n💯 100 Puntos Parker: ${p.trophies.parker100}\n👑 Tim Atkin MW Winemaker of the Year: ${p.trophies.timAtkinWinemaker}\n💰 Patrimonio Final: $${p.wealth.toLocaleString()} USD\n🎖️ Prestigio: ${p.reputation}/100\n¡Consagrado como leyenda del vino!`;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(() => alert("¡Resumen de carrera copiado al portapapeles!"));
        } else {
          alert(text);
        }
      }

      showModal(innerHtml) {
        const bd = document.getElementById("global-modal");
        const cnt = document.getElementById("modal-content");
        if (bd && cnt) {
          cnt.innerHTML = innerHtml;
          bd.classList.add("active");
        }
      }

      closeModal() {
        Sound.playClick();
        const bd = document.getElementById("global-modal");
        if (bd) bd.classList.remove("active");
      }
    }

    const UI = new UIController();
    window.UI = UI;

    document.addEventListener("DOMContentLoaded", () => {
      UI.renderStart();
    });
  </script>
</body>
</html>
